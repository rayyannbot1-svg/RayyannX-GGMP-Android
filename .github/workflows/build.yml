name: Build RayyannX GGMP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RayyannX_GGMP_Fixed_Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        run: |
          test -f RayyannX_GGMP_Fixed_Source.zip
          mkdir -p extracted
          unzip -q RayyannX_GGMP_Fixed_Source.zip -d extracted
          test -d extracted/RayyannX_GGMP_Starter/android
          cp -a extracted/RayyannX_GGMP_Starter/. .
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayyannX-GGMP-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
